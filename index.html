<!-- =========================
 SITE 1 : SITE PUBLIC DU SONDAGE
 Fichier : index.html
========================= --><!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Sondage – Préférences de légumes</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f7fa; margin:0; padding:0; }
    .container { max-width:700px; margin:40px auto; background:#fff; padding:30px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
    h1,h2 { color:#2c3e50; }
    label { display:block; margin:8px 0; }
    button { background:#2ecc71; color:#fff; border:none; padding:12px 20px; border-radius:6px; cursor:pointer; font-size:16px; }
    button:hover { background:#27ae60; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sondage – Préférences de légumes</h1><!-- ETAPE AGE -->
<div id="ageStep">
  <h2>Avant de commencer</h2>
  <label>Quel est votre âge ?</label>
  <input type="number" id="age" min="10" max="100" required />
  <br><br>
  <button onclick="startSurvey()">Commencer le sondage</button>
</div>

<!-- SONDAGE -->
<div id="surveyStep" class="hidden">
  <h2>Questions</h2>

  <p>Quels légumes aimez-vous ?</p>
  <label><input type="checkbox" value="Oignon"> Oignon</label>
  <label><input type="checkbox" value="Tomate"> Tomate</label>
  <label><input type="checkbox" value="Piment"> Piment</label>
  <label><input type="checkbox" value="Carotte"> Carotte</label>
  <label><input type="checkbox" value="Chou"> Chou</label>

  <p>Préférez-vous les légumes :</p>
  <label><input type="radio" name="mix" value="Seul"> Seul</label>
  <label><input type="radio" name="mix" value="2 légumes"> En mélange de 2</label>
  <label><input type="radio" name="mix" value="3+ légumes"> En mélange de 3 ou plus</label>

  <br><br>
  <button onclick="submitSurvey()">Envoyer</button>
</div>

<div id="thanks" class="hidden">
  <h2>Merci pour votre participation 🙏</h2>
</div>

  </div><script>
  // Compteur de visites
  let visits = localStorage.getItem('visits') || 0;
  visits++;
  localStorage.setItem('visits', visits);

  function startSurvey() {
    const age = document.getElementById('age').value;
    if(!age) return alert('Veuillez entrer votre âge');
    localStorage.setItem('currentAge', age);
    document.getElementById('ageStep').classList.add('hidden');
    document.getElementById('surveyStep').classList.remove('hidden');
  }

  function submitSurvey() {
    const age = localStorage.getItem('currentAge');
    const veggies = Array.from(document.querySelectorAll('input[type=checkbox]:checked')).map(e=>e.value);
    const mix = document.querySelector('input[name=mix]:checked')?.value;

    if(!mix) return alert('Veuillez répondre à toutes les questions');

    let data = JSON.parse(localStorage.getItem('surveyData')) || [];
    data.push({ age, veggies, mix });
    localStorage.setItem('surveyData', JSON.stringify(data));

    document.getElementById('surveyStep').classList.add('hidden');
    document.getElementById('thanks').classList.remove('hidden');
  }
</script></body>
</html>
