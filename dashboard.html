<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard – Statistiques du sondage</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111827; color:#fff; padding:40px; }
    .card { background:#1f2933; padding:20px; border-radius:10px; margin-bottom:20px; }
    h1 { color:#38bdf8; }
  </style>
</head>
<body>
  <h1>Dashboard – Sondage légumes</h1>  <div class="card" id="stats"></div><script>
  const visits = localStorage.getItem('visits') || 0;
  const data = JSON.parse(localStorage.getItem('surveyData')) || [];

  let ageGroups = {};
  let veggieCount = {};

  data.forEach(d => {
    ageGroups[d.age] = (ageGroups[d.age] || 0) + 1;
    d.veggies.forEach(v => veggieCount[v] = (veggieCount[v] || 0) + 1);
  });

  document.getElementById('stats').innerHTML = `
    <p><strong>Nombre total de visites du site du sondage :</strong> ${visits}</p>
    <p><strong>Nombre total de participants :</strong> ${data.length}</p>
    <p><strong>Légumes les plus aimés :</strong></p>
    <pre>${JSON.stringify(veggieCount, null, 2)}</pre><p><strong>Répartition par âge :</strong></p>
<pre>${JSON.stringify(ageGroups, null, 2)}</pre>

`; </script>

</body>
</html>
